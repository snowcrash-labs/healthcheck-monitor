# Copy to server.local.toml; paths are relative to this file.
listen = "127.0.0.1:9840"
connections = 64
requests = 16
event_streams = 16
view_bytes = 33554432
response_bytes = 2097152

[access]
mode = "local"

[history]
database_url_env = "HEALTHCHECK_DATABASE_URL"
connections = 2
retention = "24h"
event_rows = 10000
run_rows = 100000
gap_rows = 1000
configuration_rows = 32
queue_bytes = 16777216
queue_batches = 64

# Enable TLS with a certificate trusted by the browser to negotiate HTTP/2.
# [tls]
# certificate = "certificates/localhost.crt"
# private_key = "certificates/localhost.key"
