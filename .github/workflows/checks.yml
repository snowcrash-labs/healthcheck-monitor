name: Development checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard run check
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo check --locked -p healthcheck-monitor --no-default-features
      - run: cargo build --locked -p healthcheck-connect
      - run: cargo run --locked -p healthcheck-connect --bin connect-checksum -- target/debug/healthcheck-connect target/debug/healthcheck-connect.SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: healthcheck-connect-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/debug/healthcheck-connect
            target/debug/healthcheck-connect.SHA256SUMS
          retention-days: 14
      - run: npm --prefix dashboard audit
  history:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: healthcheck_monitor_dashboard_test
          POSTGRES_USER: monitor_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor_test -d healthcheck_monitor_dashboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      - run: cargo test --locked -p monitor-history --test postgres -- --include-ignored
        env:
          HEALTHCHECK_TEST_DATABASE_URL: postgresql://monitor_test:local-ci-only@127.0.0.1:5432/healthcheck_monitor_dashboard_test
      - run: cargo test --locked -p monitor-history --test query_history -- --include-ignored
        env:
          HEALTHCHECK_TEST_DATABASE_URL: postgresql://monitor_test:local-ci-only@127.0.0.1:5432/healthcheck_monitor_dashboard_test
      - run: docker exec ${{ job.services.postgres.id }} psql -U monitor_test -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE healthcheck_monitor_costs_test'
      - run: cargo test --locked -p monitor-history --test costs -- --include-ignored
        env:
          HEALTHCHECK_COST_TEST_DATABASE_URL: postgresql://monitor_test:local-ci-only@127.0.0.1:5432/healthcheck_monitor_costs_test
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm exec -- playwright install --with-deps chromium firefox webkit
        working-directory: dashboard
      - run: npm run test:browser
        working-directory: dashboard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures
          path: dashboard/test-results
          retention-days: 3
