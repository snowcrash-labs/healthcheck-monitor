[workspace]
members = ["crates/core", "crates/integrations", "crates/providers", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
monitor-core = { path = "crates/core" }
monitor-integrations = { path = "crates/integrations" }
monitor-providers = { path = "crates/providers" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
humantime = "2.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "hickory-dns", "json", "query", "stream"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.151"
scc = { version = "3.8.8", default-features = false }
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "io-util", "process", "net", "test-util", "parking_lot"] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
toml = "1.1.5"
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes", "release_max_level_info"] }
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = 0
# Rust 1.98.1 can reuse invalid trait-obligation fingerprints after a compilation error.
incremental = false

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
incremental = false
strip = true
lto = true
panic = "unwind"
