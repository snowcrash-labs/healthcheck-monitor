[package]
name = "monitor-history"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monitor-query.workspace = true
monitor-core.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
diesel = { version = "2.3.13", default-features = false, features = ["postgres_backend", "chrono", "uuid", "serde_json", "32-column-tables"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "bb8", "async-connection-wrapper", "migrations"] }
diesel_migrations = { version = "2.3.2", default-features = false, features = ["postgres"] }
diesel-derive-enum = { version = "2.1.0", default-features = false, features = ["postgres"] }
nutype = { version = "0.7.0", default-features = false, features = ["std","serde"] }
uuid = { version = "1.26.0", default-features = false, features = ["std","serde"] }
bb8 = { version = "0.9.1", default-features = false, features = ["parking_lot"] }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23.43", default-features = false, features = ["std","aws_lc_rs","tls12"] }
rustls-platform-verifier = { version = "0.7.0", default-features = false }

[lints]
workspace = true
