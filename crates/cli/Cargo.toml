[package]
name = "healthcheck-monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dashboard"]
dashboard = ["dep:monitor-server"]

[dependencies]
monitor-core.workspace = true
monitor-integrations.workspace = true
monitor-providers.workspace = true
monitor-runtime.workspace = true
monitor-server = { workspace = true, optional = true }
chrono.workspace = true
clap.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["json", "env-filter", "fmt", "time"] }
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["unprefixed_malloc_on_supported_platforms"] }

# jemalloc does not support background purging on Darwin.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }

[lints]
workspace = true
