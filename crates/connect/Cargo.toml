[package]
name = "healthcheck-connect"
default-run = "healthcheck-connect"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monitor-query.workspace = true
chrono.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
rmcp = { version = "3.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
oauth2 = { version = "5.0.0", default-features = false }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
webbrowser = { version = "1.2.4", default-features = false }
libc = { version = "0.2.189", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["json", "env-filter", "fmt", "time"] }
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["unprefixed_malloc_on_supported_platforms"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7.0", default-features = false, features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tempfile = { version = "3.27.0", default-features = false }
rmcp = { version = "3.2.0", default-features = false, features = ["client", "transport-child-process"] }

[lints]
workspace = true
