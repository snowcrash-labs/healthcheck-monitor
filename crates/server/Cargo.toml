[package]
name = "monitor-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
monitor-core.workspace = true
monitor-runtime.workspace = true
monitor-history.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
scc.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs", "compression-br", "compression-gzip"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs","tls12"] }
rustls = { version = "0.23.43", default-features = false, features = ["std","aws_lc_rs","tls12"] }
ipnet = { version = "2.12.1", default-features = false, features = ["serde", "std"] }
http-body = { version = "1.1.0", default-features = false }

[lints]
workspace = true

[dev-dependencies]
reqwest.workspace = true
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = { version = "3.27.0", default-features = false }
